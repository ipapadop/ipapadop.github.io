name: &name "Yiannis Papadopoulos"
email: &email giannis.papadopoulos@gmail.com

title: Yiannis Papadopoulos
lang: en

author:
  name: *name
  email: *email
  url: "https://ipapadop.github.io"

# jekyll-seo-tag: profile photo / default social preview image and
# structured data (JSON-LD "sameAs") linking your profiles.
logo: "https://github.com/ipapadop.png"
image: "https://github.com/ipapadop.png"
twitter:
  username: ipapadop
  card: summary
social:
  name: *name
  links:
    - "https://github.com/ipapadop"
    - "https://www.linkedin.com/in/ipapadop/"
    - "https://x.com/ipapadop"
    - "https://stackoverflow.com/users/487362"
    - "https://gitlab.com/ipapadop"
    - "https://orcid.org/0000-0003-4983-5052"

description: >-
  Mostly C++, Supercomputing, some AI.

remote_theme: jekyll/minima@4de3223

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme

baseurl: ""
url: "https://ipapadop.github.io"
# Universal Analytics (UA-*) was shut down by Google in 2023. To re-enable
# analytics, create a GA4 property and set its Measurement ID here:
# google_analytics: G-XXXXXXXXXX
permalink: /:categories/:year/:month/:day/:title/

markdown: kramdown

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

#
# minima options

minima:
  skin: auto  # follows the visitor's light/dark preference

  nav_pages:
    - about.md

  show_excerpts: true

  date_format: "%b %-d, %Y"

  social_links:
    - title: GitHub
      icon: github
      url: "https://github.com/ipapadop"
    - title: LinkedIn
      icon: linkedin
      url: "https://www.linkedin.com/in/ipapadop/"
    - title: X
      icon: x-twitter
      url: "https://x.com/ipapadop"
    - title: StackOverflow
      icon: stack-overflow
      url: "https://stackoverflow.com/users/487362"
    - title: GitLab
      icon: gitlab
      url: "https://gitlab.com/ipapadop"
    - title: ORCID
      icon: orcid
      url: "https://orcid.org/0000-0003-4983-5052"

disqus:
  shortname: ipapadop-github-pages

defaults:
  # Post defaults
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post
      comments: true
